<style>
:root{--g:#0b8f55;--g2:#087043;--b:#e3f3fb;--b2:#5bb8e6;--bg:#f2faf6;--card:#fff;--t:#16322a;--bd:#cfe5dc;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1d18;--card:#15281f;--t:#e5f4ec;--bd:#2b4a3f;--b:#173646;--in:#0f211a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1d18;--card:#15281f;--t:#e5f4ec;--bd:#2b4a3f;--b:#173646;--in:#0f211a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.fade{animation:f .4s ease}@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
header{background:linear-gradient(135deg,var(--g),var(--b2));color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{background:#fff;color:#000;font-weight:900;border-radius:12px;padding:6px 12px;font-family:Arial;letter-spacing:1px}
header span{flex:1;font-size:14px}header button{width:auto;padding:6px 12px;font-size:13px;background:#ffffff33;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--bd);padding:0 8px}
nav a{padding:12px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.25s;font-size:14px}
nav a.on{border-color:var(--g);color:var(--g);font-weight:700}nav a:hover{background:var(--b)}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 4px 18px #0b8f5514;margin-bottom:14px}
h2{margin:0 0 12px;color:var(--g)}h3{margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:13px;gap:4px}
input,select,textarea{padding:10px;border:1.5px solid var(--bd);border-radius:10px;font:inherit;background:var(--in);color:var(--t);transition:.2s;width:100%}
input:focus,select:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 3px #5bb8e644}
input[type=checkbox]{width:auto}.chk{flex-direction:row;align-items:center;gap:8px}
button{background:var(--g);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin:8px 4px 0 0;transition:.2s;width:auto}
button:hover{background:var(--g2);transform:translateY(-1px)}button:active{transform:scale(.96)}
button.ghost{background:var(--b);color:var(--g2)}button.red{background:#d64545}button.sm{padding:4px 10px;margin:2px;font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--g);color:#fff;padding:8px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--bd)}tr:nth-child(even) td{background:var(--b)}
.prev{background:var(--b);border-radius:12px;padding:10px;margin-top:10px}.prev b{color:var(--g2)}
.lg{max-width:360px;margin:8vh auto;text-align:center;padding:20px}.lg .logo{display:inline-block;font-size:34px;border:2px solid var(--b2)}
.lg input,.lg select{margin:6px 0}.lg button{width:100%}.lg a{display:block;margin-top:12px;color:var(--g);cursor:pointer}
.bd{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:var(--b);color:var(--g2)}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9;animation:f .25s}
.md>div{background:var(--card);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
#ts{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--g2);color:#fff;padding:10px 20px;border-radius:30px;z-index:20;animation:f .3s}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

<script>
const $=s=>document.querySelector(s),P=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

function askF(title,fields,ok){return new Promise(res=>{const m=document.createElement('div');m.className='md';
m.innerHTML=`<div><h3>${esc(title)}</h3>${fields.map((f,k)=>`<label>${esc(f.l)}${f.opts?`<select id=pf${k}>${f.opts.map(o=>`<option value="${esc(o[0])}" ${o[0]==f.v?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input id=pf${k} type="${f.t||'text'}" step=any value="${esc(f.v==null?'':f.v)}">`}</label>`).join('')}<div style="display:flex;gap:6px;margin-top:8px"><button id=pok>${ok||'حفظ'}</button><button class=ghost id=pno>إلغاء</button></div></div>`;
document.body.appendChild(m);const done=v=>{m.remove();res(v)};m.onclick=e=>{if(e.target===m)done(null)};m.querySelector('#pno').onclick=()=>done(null);m.querySelector('#pok').onclick=()=>done(fields.map((f,k)=>m.querySelector('#pf'+k).value));const f0=m.querySelector('#pf0');if(f0)f0.focus()})}
const cfm=msg=>askF(msg,[],'تأكيد').then(v=>v!==null);
function imgModal(c){const m=document.createElement('div');m.className='md';m.onclick=e=>e.target===m&&m.remove();m.innerHTML=`<div><p style="font-size:12px">التنزيل مش متاح في العرض ده. اضغط مطوّلًا على الصورة لحفظها أو خد لقطة شاشة.</p><img style="width:100%" src="${c.toDataURL('image/jpeg',.9)}"><button class=ghost onclick="this.closest('.md').remove()">إغلاق</button></div>`;document.body.appendChild(m)}
async function fbShow(b,n){if(!/\.(json|html|csv)$/.test(n))return;const t=await b.text(),m=document.createElement('div');m.className='md';m.onclick=e=>e.target===m&&m.remove();m.innerHTML=`<div><h3>${esc(n)}</h3><p style="font-size:12px">التنزيل مش متاح في العرض ده. انسخ المحتوى واحفظه في ملف بنفس الاسم.</p><textarea id=fbt style="width:100%;height:200px;direction:ltr"></textarea><button id=fbc>نسخ</button> <button class=ghost onclick="this.closest('.md').remove()">إغلاق</button></div>`;document.body.appendChild(m);const ta=m.querySelector('#fbt');ta.value=t;m.querySelector('#fbc').onclick=()=>{ta.select();try{navigator.clipboard.writeText(t).then(()=>toast('تم النسخ'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}}
const ERR=e=>'('+((e&&(e.code||e.message))||'؟')+')';

const hasClaude=()=>{try{return typeof claude!=='undefined'&&!!claude&&typeof claude.use==='function'}catch(e){return false}};
function dlBar(u,name){document.getElementById('dlb')?.remove();const b=document.createElement('div');b.id='dlb';b.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#fff;color:#000;border:2px solid #0b8f55;border-radius:12px;padding:10px 16px;z-index:20;font-size:13px;box-shadow:0 4px 18px #0004;text-align:center';b.innerHTML='لو التنزيل ما بدأش: <a href="'+u+'" download="'+esc(name)+'" target="_blank" style="color:#0b8f55;font-weight:700">اضغط هنا لحفظ '+esc(name)+'</a> <span style="cursor:pointer;margin-right:10px" onclick="this.parentNode.remove()">✕</span>';document.body.appendChild(b);setTimeout(()=>b.remove(),20000)}
async function saveFile(data,name,mime){const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
if(hasClaude()){try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return 'ok'}}catch(e){if(e&&e.code=='declined')return 'declined'}}
try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();dlBar(u,name);setTimeout(()=>URL.revokeObjectURL(u),900000);return 'ok'}catch(e){}
return 'fail'}
function jpgBytes(c,q){const s=atob(c.toDataURL('image/jpeg',q||.92).split(',')[1]),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function pdfFromJpegs(pages){const enc=new TextEncoder(),ch=[],off=[];let len=0;const push=b=>{if(typeof b==='string')b=enc.encode(b);ch.push(b);len+=b.length};
const obj=(n,fn)=>{off[n]=len;push(n+' 0 obj\n');fn();push('\nendobj\n')};
push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));const N=pages.length;
obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+pages.map((_,k)=>(3+3*k)+' 0 R').join(' ')+']>>'));
pages.forEach((p,k)=>{const a=3+3*k,c=a+1,im=a+2,cs='q '+p.pw+' 0 0 '+p.ph+' 0 0 cm /Im0 Do Q';
obj(a,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 '+p.pw+' '+p.ph+']/Resources<</XObject<</Im0 '+im+' 0 R>>>>/Contents '+c+' 0 R>>'));
obj(c,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
obj(im,()=>{push('<</Type/XObject/Subtype/Image/Width '+p.w+'/Height '+p.h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+p.jpg.length+'>>\nstream\n');push(p.jpg);push('\nendstream')})});
const xo=len,tot=3+3*N;push('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let i=1;i<tot;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');
push('trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');return new Blob(ch,{type:'application/pdf'})}
function repCanvases(l){const W=1754,H=1240,M=50,rh=42,cols=[['#',.04,0],['رقم الفاتورة',.10,1],['الإلكترونية',.11,2],['التاريخ',.09,3],['العميل',.18,4],['الصنف',.14,5],['الكمية',.05,6],['الموظف',.09,7],['الصافي',.10,10],['الإجمالي',.10,12]];
const rows=RO(l,1),pgs=[],tw=W-2*M,tot=l.reduce((s,i)=>s+(i.total||0),0),net=l.reduce((s,i)=>s+(i.net||0),0);
const first=Math.floor((H-M*2-150)/rh),rest=Math.floor((H-M*2-60)/rh);let pos=0,np=0;const pagesN=[];
let rem=rows.length;{let cap=first;pagesN.push(cap);rem-=cap;while(rem>0){pagesN.push(rest);rem-=rest}}
pagesN.forEach((cap,pi)=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
let y=M;if(pi===0){x.fillStyle='#0b8f55';x.font='bold 40px Arial,Tahoma';x.textAlign='right';x.direction='rtl';x.textBaseline='middle';x.fillText('GTS — تقرير الفواتير ('+per()+')',W-M,y+20);
x.fillStyle='#333';x.font='24px Arial,Tahoma';x.fillText('عدد الفواتير: '+l.length+'  |  الصافي: '+fmt(net)+'  |  الإجمالي: '+fmt(tot)+'  |  أعدّه: '+S.name+' — '+ts(),W-M,y+70);y+=110;x.fillStyle='#5bb8e6';x.fillRect(M,y-12,tw,4)}
let cx=W-M;const xs=cols.map(cl=>{const w=tw*cl[1];cx-=w;return[cx,w]});
x.fillStyle='#0b8f55';x.fillRect(M,y,tw,rh);cols.forEach((cl,k)=>{x.fillStyle='#fff';x.font='bold 20px Arial,Tahoma';x.textAlign='center';x.direction='rtl';x.textBaseline='middle';x.fillText(cl[0],xs[k][0]+xs[k][1]/2,y+rh/2)});y+=rh;
rows.slice(pos,pos+cap).forEach((r,ri)=>{if(ri%2){x.fillStyle='#e3f3fb';x.fillRect(M,y,tw,rh)}x.strokeStyle='#cfe5dc';x.strokeRect(M,y,tw,rh);
cols.forEach((cl,k)=>{let v=r[cl[2]];if(cl[2]===10||cl[2]===12)v=(v===''||v==null)?'':fmt(v);v=String(v==null?'':v);x.font='19px Arial,Tahoma';x.fillStyle='#111';x.textAlign='center';x.direction=RTLR.test(v)?'rtl':'ltr';x.textBaseline='middle';
const mw=xs[k][1]-12;if(x.measureText(v).width>mw){while(v.length>1&&x.measureText(v+'…').width>mw)v=v.slice(0,-1);v+='…'}x.fillText(v,xs[k][0]+xs[k][1]/2,y+rh/2)});y+=rh});
pos+=cap;x.fillStyle='#666';x.font='18px Arial';x.textAlign='center';x.direction='ltr';x.fillText('GTS  —  '+(pi+1)+' / '+pagesN.length,W/2,H-28);pgs.push(c)});return pgs}
async function repPdf(l,n){try{const pg=repCanvases(l);const blob=pdfFromJpegs(pg.map(c=>({jpg:jpgBytes(c,.9),w:c.width,h:c.height,pw:841.89,ph:595.28})));pdfModal(blob,n+'.pdf',pg[0])}catch(e){toast('تعذّر إنشاء PDF '+ERR(e))}}

<p style="font-size:12px">اكتب السعر في خانة الصنف ودوس "تثبيت السعر" (أو Enter). بيفضل ثابت ويظهر تلقائيًا في قايمة الأصناف في الفاتورة الإلكترونية، ولتغييره دوس "تعديل السعر".</p>
<table><tr><th>الصنف</th><th>السعر</th><th></th></tr>${D.items.map((t,i)=>(t.p>0&&IE!==i)?`<tr><td>${esc(t.n)}</td><td><b>${fmt(t.p)}</b> <span class=bd>✓ ثابت</span></td><td><button class=sm onclick="IE=${i};AD.items()">✏️ تعديل السعر</button><button class="sm red" onclick="idl(${i})">حذف</button></td></tr>`:`<tr><td>${esc(t.n)}</td><td><input id=ip${i} inputmode=decimal autocomplete=off value="${t.p||''}" placeholder="اكتب السعر" onkeydown="event.key==='Enter'&&isv(${i})"></td><td><button class=sm onclick="isv(${i})">تثبيت السعر</button>${IE===i?`<button class="sm ghost" onclick="IE=-1;AD.items()">إلغاء</button>`:`<button class="sm red" onclick="idl(${i})">حذف</button>`}</td></tr>`).join('')}</table>`);
const isv=async i=>{const t=D.items[i],el=$('#ip'+i),p=num(el?el.value.trim():'');if(!(p>0))return toast('اكتب السعر الأول');L('تثبيت سعر '+t.n+' = '+p);t.p=p;IE=-1;AD.items();await vfy('items')};
const idl=async i=>{if(!await cfm('حذف الصنف؟'))return;IE=-1;L('حذف صنف '+D.items[i].n);D.items.splice(i,1);AD.items();await vfy('items')};
async function vfy(m){const ok=await pushMeta(m||'items');if(ok)toast(DB?'✓ السعر اتثبت ومحفوظ للجميع':'✓ السعر اتحفظ على الجهاز');else if(DB)toast('⚠️ السعر ما اتحفظش')}
const ia=async()=>{const n=$('#in_').value.trim(),p=num($('#ip').value);if(!n)return toast('اكتب اسم الصنف');if(!(p>0))return toast('اكتب السعر (أرقام فقط)');const o=D.items.find(x=>x.n===n);if(o){o.p=p;L('تعديل سعر '+n+' → '+p)}else{D.items.push({n,p});L('إضافة صنف '+n)}AD.items();await vfy('items')};
const ie=async i=>{const t=D.items[i],q=await askF('تعديل صنف',[{l:'اسم الصنف',v:t.n},{l:'السعر الموحد (0 = بدون سعر ثابت)',v:t.p,t:'number'}]);if(!q)return;const n=q[0],p=q[1];if(n&&p!==''){t.n=n;t.p=+p||0;L('تعديل صنف '+n);save();AD.items()}};
AD.set=()=>{const c={};D.inv.forEach(i=>c[i.date.slice(0,7)]=(c[i.date.slice(0,7)]||0)+1);
ab(`<label>الحد الأقصى لعدد فواتير الشهر (بعده يُقفل الإدخال)<input id=lm inputmode=decimal value="${D.cfg.limit}"></label><button onclick="D.cfg.limit=num($('#lm').value)||1;L('تغيير حد الفواتير');pushMeta('cfg').then(o=>toast(o?'✓ تم':'⚠️ ما اتحفظش'))">حفظ</button>
<h3>قفل / فتح شهر</h3><div class=grid><input id=mm type=month value="${today().slice(0,7)}"></div><button onclick="mcx('c')">🔒 قفل الشهر</button><button class=ghost onclick="mcx('o')">🔓 فتح الشهر</button><h3>الشهور</h3><table><tr><th>الشهر</th><th>الفواتير</th><th>الحالة</th><th></th></tr>${Object.keys(c).sort().map(m=>`<tr><td>${m}</td><td>${c[m]}/${D.cfg.limit}</td><td>${D.cfg.closed.includes(m)?'مقفول':'مفتوح'}</td><td><button class=sm onclick="mc('${m}')">${D.cfg.closed.includes(m)?'فتح':'قفل'}</button></td></tr>`).join('')}</table><h3>نسخة احتياطية</h3><button onclick=bk()>⬇️ تصدير نسخة احتياطية</button><button class=ghost onclick=bi()>⬆️ استرجاع نسخة</button>`)};

const bk=async()=>{const r=await saveFile(new Blob([JSON.stringify(D)],{type:'application/json'}),'GTS-backup-'+today()+'.json');if(r==='ok')toast('تم تجهيز النسخة الاحتياطية ✓')};
const bi=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const x=JSON.parse(await f.files[0].text());if(!x.users||!x.inv)throw 0;if(!await cfm('استرجاع النسخة؟ هتتضاف البيانات الناقصة وتتحدث الأصناف والضرائب.'))return;['users','inv','req','cust'].forEach(c=>{(x[c]||[]).forEach(r=>{const k=CK[c];if(!D[c].some(z=>z[k]===r[k]))D[c].push(r)})});['depts','taxes','items','cfg'].forEach(m=>{if(x[m])D[m]=x[m]});L('استرجاع نسخة احتياطية');save();toast('تم الاسترجاع ✓');AD.set()}catch(e){toast('ملف غير صالح')}};f.click()};
const mcx=async f=>{const m=$('#mm').value;if(!m)return toast('اختر الشهر');const k=D.cfg.closed,h=k.includes(m);if(f==='c'&&!h)k.push(m);if(f==='o'&&h)k.splice(k.indexOf(m),1);L((f==='c'?'قفل ':'فتح ')+'شهر '+m);AD.set();const ok=await pushMeta('cfg');toast(ok?(f==='c'?'🔒 تم قفل '+m:'🔓 تم فتح '+m):'⚠️ ما اتحفظش')};
const mc=async m=>{const k=D.cfg.closed;k.includes(m)?k.splice(k.indexOf(m),1):k.push(m);L('قفل/فتح شهر '+m);AD.set();const ok=await pushMeta('cfg');toast(ok?'✓ تم':'⚠️ ما اتحفظش')};
AD.log=()=>ab(`<table><tr><th>الوقت</th><th>المستخدم</th><th>الحدث</th></tr>${D.log.slice(0,150).map(l=>`<tr><td>${l.t}</td><td>${esc(l.u)}</td><td>${esc(l.a)}</td></tr>`).join('')}</table>`);
app();
</script></body></html>
